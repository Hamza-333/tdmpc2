defaults:
    - override hydra/launcher: submitit_local

# environment
task: ???
obs: state
episodic: false

# evaluation
checkpoint: /workspace/tdmpc2/checkpoints/myo-hand-key-turn-hard-3.pt
eval_episodes: 10
eval_freq: 50000

# training
steps: 10_000_000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000
exp_name: default
data_dir: ???

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: ???
min_std: 0.05
max_std: 2
temperature: 0.5
error_penalty: 0.1

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
model_size: ???
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 512
task_dim: 96
num_q: 5
dropout: 0.01
simnorm_dim: 8

# logging
wandb_project: tdmpc2
wandb_entity: ???
wandb_silent: false
enable_wandb: true
save_csv: true

# misc
compile: false
save_video: true
save_agent: true
seed: 1

# convenience
work_dir: ???
task_title: ???
multitask: ???
tasks: ???
obs_shape: ???
action_dim: 512
episode_length: ???
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: ???
bin_size: ???

# error estimator
error_model_lr: 1e-4
error_model_training_iters: 500
error_model_eval_iters: 100
error_model_eval_freq: 10
error_model_data_steps: 2500
error_model_batch_size: 512
error_model_epochs: 500
error_model_replay_buffer_size: 1000000
error_model_save_freq: 20
error_model_save_path: /workspace/tdmpc2/error_model_vector_checkpoints
error_model_plot_dir: /workspace/tdmpc2/results/error_model_vector/
error_model_log_dir: /workspace/tdmpc2/error_model_vector_logs
